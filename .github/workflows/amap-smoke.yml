name: Live AMap smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
      timezone: Asia/Shanghai

permissions:
  contents: read

concurrency:
  group: live-amap-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Test the live AMap API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AMAP_WEB_SERVICE_KEY: ${{ secrets.AMAP_WEB_SERVICE_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify AMap secret
        run: |
          if [ -z "$AMAP_WEB_SERVICE_KEY" ]; then
            echo "::error::Add AMAP_WEB_SERVICE_KEY as a repository Actions secret."
            exit 1
          fi

      - name: Run live AMap smoke test
        run: npm run smoke:amap

      - name: Upload smoke report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: live-amap-report-${{ github.run_id }}
          path: .tmp/live-amap-results.json
          if-no-files-found: ignore
          retention-days: 14
